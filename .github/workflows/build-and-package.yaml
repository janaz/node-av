name: "Build and Package"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CACHE_VERSION_LINUX: "v34"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to set on packages (e.g. 5.2.2-beta.1). Leave empty to use package.json version."
        required: false
        type: string
  push:
    branches:
      - main
      - stripped-ffmpeg
    paths:
      - "src/**"
      - "externals/jellyfin-ffmpeg/**"
      - ".github/workflows/build-and-package.yaml"
      - "binding-jellyfin.gyp"

jobs:
  build_linux:
    name: "Linux ${{ matrix.arch }}"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: amd64
            runner: ubuntu-latest
          - arch: arm64
            target: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Get Jellyfin FFmpeg commit hash
        id: ffmpeg-hash
        run: |
          echo "hash=$(git -C externals/jellyfin-ffmpeg rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Prepare directories
        run: |
          sudo mkdir -p /opt/ffbuild/prefix
          sudo chown -R $USER:$USER /opt/ffbuild
          sudo chmod -R 755 /opt/ffbuild

      - name: Restore FFmpeg cache
        id: cache-ffmpeg
        uses: actions/cache@v5
        with:
          path: |
            /opt/ffbuild/prefix
            externals/jellyfin-ffmpeg/config*.h
          key: ffmpeg-linux-${{ matrix.arch }}-${{ env.CACHE_VERSION_LINUX }}-${{ steps.ffmpeg-hash.outputs.hash }}
          restore-keys: |
            ffmpeg-linux-${{ matrix.arch }}-${{ env.CACHE_VERSION_LINUX }}-${{ steps.ffmpeg-hash.outputs.hash }}
            ffmpeg-linux-${{ matrix.arch }}-${{ env.CACHE_VERSION_LINUX }}-

      - name: Patch FFmpeg configure for minimal video-only build
        run: |
          cat > externals/jellyfin-ffmpeg/builder/variants/defaults-gpl.sh << 'DEFAULTS'
          FF_CONFIGURE="--enable-gpl --enable-version3 --disable-ffplay --disable-debug --disable-doc --disable-sdl2"
          FF_CFLAGS=""
          FF_CXXFLAGS=""
          FF_LDFLAGS=""
          GIT_BRANCH="jellyfin"
          LICENSE_FILE="COPYING.GPLv3"

          # LTO disabled: Docker GCC version may differ from host GCC
          # [[ $TARGET == linux* ]] && FF_CONFIGURE+=" --enable-lto=auto" || true
          # [[ $TARGET == win* ]] && FF_CONFIGURE+=" --enable-lto=auto" || true
          [[ $TARGET == mac* ]] && FF_CONFIGURE+=" --enable-lto=thin" || true

          # Disable auto-detected features on Linux that we don't link against
          [[ $TARGET == linux* ]] && FF_CONFIGURE+=" --disable-alsa --disable-xlib --disable-libxcb --disable-libdrm --disable-vaapi --disable-vdpau --disable-vulkan --disable-opencl" || true

          # ── Minimal video-only build ──────────────────────────────────────────
          # Disable all components then selectively re-enable only what we need.
          # No audio support, no hardware acceleration, no network protocols.

          # Encoders: GIF, APNG, WebP (animated), PNG, raw passthrough
          FF_CONFIGURE+=" --disable-encoders"
          FF_CONFIGURE+=" --enable-encoder=gif,apng,libwebp,libwebp_anim,png,rawvideo,wrapped_avframe"

          # Decoders: H.264, HEVC, VP9, AV1 (libdav1d), image formats, raw
          FF_CONFIGURE+=" --disable-decoders"
          FF_CONFIGURE+=" --enable-decoder=h264,hevc,vp9,av1,libdav1d,png,apng,gif,webp,rawvideo,wrapped_avframe"

          # Muxers: output containers for GIF/APNG/WebP/MOV/MP4/MKV
          FF_CONFIGURE+=" --disable-muxers"
          FF_CONFIGURE+=" --enable-muxer=gif,apng,webp,image2,mov,mp4,matroska,webm,rawvideo,null"

          # Demuxers: input containers
          FF_CONFIGURE+=" --disable-demuxers"
          FF_CONFIGURE+=" --enable-demuxer=mov,matroska,image2,gif,apng,concat,rawvideo"

          # Parsers: codec bitstream parsers
          FF_CONFIGURE+=" --disable-parsers"
          FF_CONFIGURE+=" --enable-parser=h264,hevc,vp9,av1,png,webp"

          # Bitstream filters
          FF_CONFIGURE+=" --disable-bsfs"
          FF_CONFIGURE+=" --enable-bsf=h264_mp4toannexb,hevc_mp4toannexb,vp9_superframe,av1_frame_merge,null,extract_extradata"

          # Protocols: local file I/O only
          FF_CONFIGURE+=" --disable-protocols"
          FF_CONFIGURE+=" --enable-protocol=file,pipe,data,concat,unix"

          # Devices: none needed
          FF_CONFIGURE+=" --disable-devices --disable-indevs --disable-outdevs"

          # Filters: video processing filters only (no audio filters)
          FF_CONFIGURE+=" --disable-filters"
          FF_CONFIGURE+=" --enable-filter=buffer,buffersink,null,copy,format,fps,scale,crop,overlay"
          FF_CONFIGURE+=" --enable-filter=hflip,vflip,transpose,rotate,split,pad,fade,trim,select"
          FF_CONFIGURE+=" --enable-filter=setpts,setsar,setdar,framerate,framestep,concat,fifo"
          FF_CONFIGURE+=" --enable-filter=drawbox,color,negate,edgedetect,hstack,vstack,yadif,bwdif"
          DEFAULTS

          echo "Patched defaults-gpl.sh:"
          cat externals/jellyfin-ffmpeg/builder/variants/defaults-gpl.sh

      - name: Build FFmpeg
        id: build-ffmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /opt/ffbuild
          sudo mkdir -p /opt/ffbuild/prefix
          sudo chown -R $USER:$USER /opt/ffbuild
          sudo chmod -R 755 /opt/ffbuild

          cd externals/jellyfin-ffmpeg/builder

          if [ "${{ matrix.target }}" = "amd64" ]; then
            TARGET="linux64"
          else
            TARGET="linuxarm64"
          fi

          IMAGE="ghcr.io/seydx/jellyfin-ffmpeg/${TARGET}-gpl:latest"

          if docker pull "${IMAGE}" 2>/dev/null; then
            echo "Using Docker image from registry: ${IMAGE}"
          else
            echo "Docker image not in registry, building locally..."
            GITHUB_REPOSITORY="seydx/jellyfin-ffmpeg" ./makeimage.sh "${TARGET}" gpl
          fi

          export GITHUB_REPOSITORY="seydx/jellyfin-ffmpeg"
          ./build.sh "${TARGET}" gpl

          if [ -d ffbuild/prefix ]; then
            sudo mkdir -p /opt/ffbuild/prefix
            sudo cp -r ffbuild/prefix/* /opt/ffbuild/prefix/

            echo "Copying config files from FFmpeg build directory..."
            for config_file in ffbuild/ffmpeg/config*.h; do
              if [ -f "$config_file" ]; then
                filename=$(basename "$config_file")
                sudo cp "$config_file" "../$filename"
                echo "Copied $filename"
              fi
            done

            if [ ! -f ../config.h ] || [ ! -f ../config_components.h ]; then
              echo "Error: config.h or config_components.h not found!"
              exit 1
            fi

            CONTAINER_ID=$(docker create "${IMAGE}")
            docker cp "${CONTAINER_ID}:/opt/ffbuild/lib" /tmp/codec-libs 2>/dev/null && {
              sudo cp -n /tmp/codec-libs/*.a /opt/ffbuild/prefix/lib/ 2>/dev/null || true
              rm -rf /tmp/codec-libs
            }
            docker cp "${CONTAINER_ID}:/opt/ffbuild/include" /tmp/codec-includes 2>/dev/null && {
              sudo cp -rn /tmp/codec-includes/* /opt/ffbuild/prefix/include/ 2>/dev/null || true
              rm -rf /tmp/codec-includes
            }
            docker rm "${CONTAINER_ID}"

            rm -rf ffbuild
            sudo chown -R $USER:$USER /opt/ffbuild
          else
            echo "Error: ffbuild/prefix not found!"
            exit 1
          fi

          cd ../..

      - name: Save FFmpeg cache
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true' && steps.build-ffmpeg.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: |
            /opt/ffbuild/prefix
            externals/jellyfin-ffmpeg/config*.h
          key: ffmpeg-linux-${{ matrix.arch }}-${{ env.CACHE_VERSION_LINUX }}-${{ steps.ffmpeg-hash.outputs.hash }}

      - name: Build Native Addon in Docker
        run: |
          cp binding-jellyfin.gyp binding.gyp

          if [ "${{ matrix.target }}" = "amd64" ]; then
            TARGET="linux64"
          else
            TARGET="linuxarm64"
          fi

          IMAGE="ghcr.io/seydx/jellyfin-ffmpeg/${TARGET}-gpl:latest"

          if ! docker image inspect "${IMAGE}" > /dev/null 2>&1; then
            docker pull "${IMAGE}"
          fi

          docker run --rm \
            -v "$(pwd)":/workspace \
            -v /opt/ffbuild:/opt/ffbuild \
            -w /workspace \
            -e PKG_CONFIG_PATH="/opt/ffbuild/prefix/lib/pkgconfig" \
            "${IMAGE}" \
            bash -c "
              set -e
              curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
              apt-get install -y nodejs
              npm install --ignore-scripts
              npx prebuildify --napi --strip --arch=${{ matrix.arch }} --tag-libc
              chown -R 1001:127 prebuilds node_modules build 2>/dev/null || true
            "

          BUILT_FILE=$(find prebuilds -name "*.node" -type f | head -1)
          if [ -n "$BUILT_FILE" ]; then
            DIR=$(dirname "$BUILT_FILE")
            mv "$BUILT_FILE" "$DIR/node-av.node"
            echo "Renamed $(basename $BUILT_FILE) -> node-av.node"

            mkdir -p binary
            cp "$DIR/node-av.node" binary/node-av.node
          else
            echo "Error: No .node file found in prebuilds directory"
            exit 1
          fi

      - name: Run Tests
        env:
          AV_FROM_SOURCE: 1
        run: |
          npm install --ignore-scripts
          npm run test:all

      - name: Upload Prebuild
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: prebuild-linux-${{ matrix.arch }}
          path: prebuilds/
          if-no-files-found: ignore

  package:
    name: "Package NPM Tarballs"
    needs: build_linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build TypeScript
        run: npm run build:tsc

      - name: Download all prebuilds
        uses: actions/download-artifact@v7
        with:
          pattern: prebuild-*
          path: prebuilds-artifacts

      - name: Prepare prebuilds structure
        run: |
          mkdir -p prebuilds

          for dir in prebuilds-artifacts/*/; do
            cp -r "$dir"* prebuilds/
          done

          echo "Combined prebuilds structure:"
          ls -laR prebuilds/

          echo -e "\nVerifying platform coverage:"
          for platform in linux-x64 linux-arm64; do
            if [ -d "prebuilds/$platform" ]; then
              echo "  $platform"
            else
              echo "  MISSING: $platform"
              exit 1
            fi
          done

      - name: Create platform packages
        run: |
          node scripts/create-platform-packages.js

          for platform in linux-x64 linux-arm64; do
            if [ -d "prebuilds/$platform" ]; then
              cd "prebuilds/$platform"
              zip -9 "../../packages/$platform/node-av.node.zip" node-av.node
              cd ../..
              echo "Compressed binary for $platform"
            fi
          done

      - name: Update version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Using version: $VERSION"

          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if [ "$CURRENT_VERSION" != "$VERSION" ]; then
            npm version $VERSION --no-git-tag-version
          fi

          for pkg in packages/*/package.json; do
            if [ -f "$pkg" ]; then
              cd $(dirname "$pkg")
              PKG_VERSION=$(node -p "require('./package.json').version")
              if [ "$PKG_VERSION" != "$VERSION" ]; then
                npm version $VERSION --no-git-tag-version
              fi
              cd -
            fi
          done

      - name: Create npm tarballs
        run: |
          mkdir -p npm-packages

          # Pack platform packages
          for platform in linux-x64 linux-arm64; do
            cd "packages/$platform"
            npm pack --pack-destination ../../npm-packages
            cd ../..
          done

          # Pack main package
          npm pack --pack-destination npm-packages

          echo "Created npm packages:"
          ls -la npm-packages/

      - name: Upload npm packages
        uses: actions/upload-artifact@v6
        with:
          name: npm-packages
          path: npm-packages/*.tgz
          if-no-files-found: error
